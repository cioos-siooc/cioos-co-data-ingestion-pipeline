# Coolify-specific override — layered on top of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.coolify.yml up -d
#
# In Coolify, point the resource at docker-compose.yml and add this file as an
# additional compose file so Coolify merges it in.
#
# Drops erddap's and prefect's published host ports and adds SERVICE_FQDN_*
# "magic" env vars: Coolify reads SERVICE_FQDN_<SERVICE>_<PORT> at deploy
# time, generates a public FQDN for it, and proxies external traffic to that
# container port over Coolify's internal network — so the host ports are
# never bound directly.
#
# The base file's `ports: "${ERDDAP_PORT:-8080}:8080"` and `"4200:4200"` work
# fine for local/standalone use, but under Coolify they collide as soon as
# more than one deployment of this stack (e.g. main + a feature branch, both
# on cioos-co-dev-2) tries to bind the same host port — only one process can
# hold a given 0.0.0.0 port at a time. `!reset` clears the base file's `ports`
# list (compose overrides can only add to lists, not remove).
services:
  erddap:
    ports: !reset []
    environment:
      - SERVICE_FQDN_ERDDAP_8080

  prefect:
    ports: !reset []
    environment:
      # Without this, the Prefect UI's browser JS calls the API at
      # PREFECT_API_URL (http://127.0.0.1:4200/api) — a loopback address
      # that's meaningless to a remote browser reaching the UI through
      # Coolify's proxy/FQDN. A relative path keeps the API call same-origin
      # regardless of what domain the UI is served from.
      PREFECT_UI_API_URL: /api
      SERVICE_FQDN_PREFECT_4200: null
