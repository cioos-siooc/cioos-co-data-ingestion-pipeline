[project]
name = "cioos-ingest"
version = "0.1.0"
description = "CIOOS ingestion pipelines (ECCC buoys, MEDS buoys, Argo Canada) publishing to ERDDAP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2024.10.0",
    "pandas>=2.2.0",
    "pika>=1.3.2",
    "prefect>=3.4.22",
    "requests>=2.32.5",
]

[project.optional-dependencies]
# fsspec backends for non-local PUBLISH_URL destinations (s3://, sftp://).
remote = [
    "s3fs>=2024.10.0",
    "paramiko>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
cioos-ingest = "cioos_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cioos_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
