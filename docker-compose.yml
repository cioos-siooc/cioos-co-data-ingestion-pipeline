# The ERDDAP service itself is not defined here — it is pulled in from the
# cioos-national-erddap submodule's own docker-compose.yml via `include`.
# `include` rebases that file's relative paths (./erddap/content, ./datasets,
# ./datasets.d, ./.env) onto the submodule directory, which is exactly where
# this stack writes buoy NCCSV, drops the datasets.d fragment, and runs the
# sync — so everything lines up without redefining the service here.
include:
  - path: cioos-national-erddap/docker-compose.yml
    env_file: cioos-national-erddap/.env

services:
  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"  # Prefect UI + API
    environment:
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_HOME: /root/.prefect
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # All three pipelines run from the same image (built once from the root
  # Dockerfile); the per-service `command:` picks the pipeline via the CLI.

  # Real-time ECCC buoy pipeline: long-running AMQP consumer of the MSC Datamart
  # SWOB-ML marine feed, appending NCCSV rows per station.
  eccc_buoy_parser:
    build: .
    image: cioos-ingest:local
    command: ["cioos-ingest", "eccc"]
    volumes:
      # Buoy NCCSV files are written into the national ERDDAP submodule's shared
      # datasets dir, which the (included) erddap service reads at /datasets.
      - ./cioos-national-erddap/datasets:/app/datasets
      - ./config/eccc:/app/config
      - ./data/eccc:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

  # Non-real-time MEDS buoy pipeline: a scheduled Prefect flow that downloads the
  # MEDS CSV archive, fixes it, and writes per-station CSVs into the same national
  # ERDDAP datasets dir. Served on a daily cron (see MEDS_CRON); trigger a run
  # from the Prefect UI to populate immediately on first boot.
  meds_buoy_parser:
    build: .
    image: cioos-ingest:local
    command: ["cioos-ingest", "meds"]
    volumes:
      - ./cioos-national-erddap/datasets:/app/datasets
      - ./data/meds:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - MEDS_CRON=0 6 * * *
      # - MEDS_STATIONS=c46131,meds210,wel233   # optional dev allowlist
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

  # Argo Canada pipeline: a scheduled Prefect flow that mirrors the MEDS DAC's
  # aggregated <WMO>_prof.nc files from the Argo GDAC into the national ERDDAP
  # datasets dir (served as ARGO_MEDS). Demo default mirrors only the first 10
  # floats — set ARGO_FLOAT_LIMIT=0 for the full DAC (~900 floats, ~2 GB).
  argo_meds_parser:
    build: .
    image: cioos-ingest:local
    command: ["cioos-ingest", "argo"]
    volumes:
      - ./cioos-national-erddap/datasets:/app/datasets
      - ./data/argo:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - ARGO_CRON=0 7 * * *
      - ARGO_FLOAT_LIMIT=10
      # - ARGO_FLOATS=4902674,4902530   # optional dev allowlist (overrides limit)
      # - ARGO_GDAC_URL=https://usgodae.org/pub/outgoing/argo   # US GODAE mirror
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: run the national ERDDAP sync (from the cioos-national-erddap
  # submodule). It harvests the regional CIOOS servers AND merges every
  # datasets.d/*.xml fragment (including the ECCC buoy fragment) into
  # erddap/content/datasets.xml, then exits. erddap waits for it to finish.
  erddap_sync:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /work
    volumes:
      - ./cioos-national-erddap:/work
    environment:
      # Keep uv's venv/cache out of the (git-tracked) submodule working tree.
      UV_PROJECT_ENVIRONMENT: /venv
      UV_CACHE_DIR: /uvcache
    command: ["uv", "run", "sync-erddap-datasets.py"]
    restart: "no"

  # erddap is defined in the included submodule compose; only add the ordering
  # so it starts after the one-shot sync has merged datasets.xml.
  erddap:
    depends_on:
      erddap_sync:
        condition: service_completed_successfully

volumes:
  prefect_data:
