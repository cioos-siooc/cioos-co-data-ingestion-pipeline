services:
  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"  # Prefect UI + API
    environment:
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_HOME: /root/.prefect
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  eccc_buoy_parser:
    build:
      context: ./ECCC_Buoy_Parser
      dockerfile: Dockerfile
    volumes:
      # Buoy NCCSV files are written into the national ERDDAP submodule's shared
      # datasets dir, which the erddap service below reads at /datasets.
      - ./cioos-national-erddap/datasets:/app/datasets
      - ./ECCC_Buoy_Parser/app/config:/app/config
      - ./ECCC_Buoy_Parser/app/data:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: run the national ERDDAP sync (from the cioos-national-erddap
  # submodule). It harvests the regional CIOOS servers AND merges every
  # datasets.d/*.xml fragment (including the ECCC buoy fragment) into
  # erddap/content/datasets.xml, then exits. erddap waits for it to finish.
  erddap_sync:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /work
    volumes:
      - ./cioos-national-erddap:/work
    environment:
      # Keep uv's venv/cache out of the (git-tracked) submodule working tree.
      UV_PROJECT_ENVIRONMENT: /venv
      UV_CACHE_DIR: /uvcache
    command: ["uv", "run", "sync-erddap-datasets.py"]
    restart: "no"

  # National CIOOS ERDDAP (served from the cioos-national-erddap submodule).
  # Replaces the parser's previously-bundled ERDDAP; serves the regional
  # datasets plus the ECCC buoy dataset written by eccc_buoy_parser.
  erddap:
    image: erddap/erddap:v2.28.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./cioos-national-erddap/erddap/conf/robots.txt:/usr/local/tomcat/webapps/ROOT/robots.txt
      - ./cioos-national-erddap/erddap/content:/usr/local/tomcat/content/erddap
      - ./cioos-national-erddap/erddap/data:/erddapData
      - ./cioos-national-erddap/datasets:/datasets
      - ./cioos-national-erddap/datasets.d:/datasets.d
    environment:
      ERDDAP_MIN_MEMORY: 1G
      ERDDAP_MAX_MEMORY: 2G
      ERDDAP_bigParentDirectory: /erddapData/
      ERDDAP_baseUrl: http://localhost:8080
      ERDDAP_baseHttpsUrl: https://localhost:8080
      ERDDAP_flagKeyKey: changed
      ERDDAP_emailEverythingTo: this+goes+nowhere@doesnotexist.ioos.us
      ERDDAP_adminInstitution: Canadian Integrated Ocean Observing System
      ERDDAP_adminInstitutionUrl: https://cioos.ca/
      ERDDAP_adminIndividualName: CIOOS Data Manager
      ERDDAP_adminPosition: Data Manager
      ERDDAP_adminPhone: ""
      ERDDAP_adminAddress: ""
      ERDDAP_adminCity: Halifax
      ERDDAP_adminStateOrProvince: NS
      ERDDAP_adminPostalCode: ""
      ERDDAP_adminCountry: CA
      ERDDAP_adminEmail: info@cioos.ca
    depends_on:
      erddap_sync:
        condition: service_completed_successfully

volumes:
  prefect_data:
