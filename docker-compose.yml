services:
  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"  # Prefect UI + API
    environment:
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_HOME: /root/.prefect
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # All three pipelines run from the same image (built once from the root
  # Dockerfile); the per-service `command:` picks the pipeline via the CLI.
  #
  # Each publishes to PUBLISH_URL — by default the CIOOS Juno buoy bucket, a
  # Ceph RADOS Gateway speaking S3. The two AWS_* credentials come from the
  # gitignored .env locally, or from Coolify's environment variables in
  # production; they are never committed. Endpoint and region carry defaults
  # (the region is a placeholder the gateway ignores, but SDKs demand one).
  # Set PUBLISH_URL=file:///app/datasets to publish locally instead.

  # Real-time ECCC buoy pipeline: long-running AMQP consumer of the MSC Datamart
  # SWOB-ML marine feed, appending NCCSV rows per station.
  eccc_buoy_parser:
    build: .
    image: cioos-ingest:local
    command: ["cioos-ingest", "eccc"]
    volumes:
      - ./config/eccc:/app/config
      - ./data/eccc:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PUBLISH_URL=${PUBLISH_URL:-s3://cioos-juno-buoy-data/datasets}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-https://objets.juno.calculquebec.ca}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

  # Non-real-time MEDS buoy pipeline: a scheduled Prefect flow that downloads the
  # MEDS CSV archive, fixes it, and publishes per-station CSVs. Served on a daily
  # cron (see MEDS_CRON); trigger a run from the Prefect UI to populate
  # immediately on first boot.
  meds_buoy_parser:
    build: .
    image: cioos-ingest:local
    command: ["cioos-ingest", "meds"]
    volumes:
      - ./data/meds:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PUBLISH_URL=${PUBLISH_URL:-s3://cioos-juno-buoy-data/datasets}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-https://objets.juno.calculquebec.ca}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - MEDS_CRON=0 6 * * *
      # - MEDS_STATIONS=c46131,meds210,wel233   # optional dev allowlist
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

  # Argo Canada pipeline: a scheduled Prefect flow that mirrors the MEDS DAC's
  # aggregated <WMO>_prof.nc files from the Argo GDAC and publishes them as
  # ARGO_MEDS. Set ARGO_FLOAT_LIMIT to mirror only the first N floats
  # (0 = the full DAC, ~900 floats, ~2 GB).
  argo_meds_parser:
    build: .
    image: cioos-ingest:local
    command: ["cioos-ingest", "argo"]
    volumes:
      - ./data/argo:/app/data
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PUBLISH_URL=${PUBLISH_URL:-s3://cioos-juno-buoy-data/datasets}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-https://objets.juno.calculquebec.ca}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ARGO_CRON=0 7 * * *
      - ARGO_FLOAT_LIMIT=0
      # - ARGO_FLOATS=4902674,4902530   # optional dev allowlist (overrides limit)
      # - ARGO_GDAC_URL=https://usgodae.org/pub/outgoing/argo   # US GODAE mirror
    depends_on:
      prefect:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect_data:
